name: Capture Public Proof

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
  push:
    branches: ['agent/final-visual-proof']
    paths:
      - 'scripts/capture-public-proof.cjs'
      - '.github/workflows/capture-public-proof.yml'

permissions:
  contents: write

jobs:
  capture:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.repository.default_branch }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install isolated Playwright runtime
        run: |
          mkdir -p /tmp/public-proof-playwright
          cd /tmp/public-proof-playwright
          npm init -y
          npm install --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Install GIF tooling
        run: sudo apt-get update && sudo apt-get install -y imagemagick gifsicle

      - name: Capture deployed proof surfaces
        env:
          NODE_PATH: /tmp/public-proof-playwright/node_modules
          CAPTURE_BASE_URL: https://ankitparekh007.github.io/ngx-copilot-platform/
          CAPTURE_OUTPUT_DIR: ${{ runner.temp }}/public-proof-captures
        run: node scripts/capture-public-proof.cjs

      - name: Build optimized platform walkthrough GIF
        shell: bash
        run: |
          set -euo pipefail
          captures='${{ runner.temp }}/public-proof-captures'
          out='docs/assets/public-proof/platform-failure-lab.gif'
          mkdir -p "$(dirname "$out")"
          frames=()
          for name in platform-main-demo platform-failure-lab-default failure-retrieval-unavailable failure-approval-rejected failure-sse-disconnect failure-tool-policy-disabled; do
            if [[ -s "$captures/$name.png" ]]; then frames+=("$captures/$name.png"); fi
          done
          if (( ${#frames[@]} < 5 )); then
            echo "Need at least five real platform frames; got ${#frames[@]}" >&2
            cat "$captures/manifest.json" >&2
            exit 1
          fi
          convert -delay 125 -loop 0 "${frames[@]}" -resize '960x960>' -layers Optimize "$out"
          gifsicle -O3 --colors 160 "$out" -o "$out"
          test -s "$out"
          test "$(stat -c%s "$out")" -lt 8000000

      - name: Upload public proof captures
        uses: actions/upload-artifact@v4
        with:
          name: ngx-copilot-platform-public-proof
          path: |
            ${{ runner.temp }}/public-proof-captures
            docs/assets/public-proof/platform-failure-lab.gif
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated final asset to generation branch
        if: ${{ github.event_name == 'push' && github.ref_name == 'agent/final-visual-proof' }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/public-proof/platform-failure-lab.gif
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add final platform public proof GIF [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
