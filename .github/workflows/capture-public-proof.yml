name: Capture Public Proof

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: ['agent/final-visual-proof']
    paths:
      - 'scripts/capture-public-proof.cjs'
      - '.github/workflows/capture-public-proof.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build SDK
        run: pnpm --filter @ankit-parekh-007/ngx-copilot-sdk build
      - name: Start exact branch demo locally
        shell: bash
        run: |
          pnpm --filter demo-app start -- --host 127.0.0.1 --port 4203 > /tmp/ngx-copilot-demo.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4203/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/ngx-copilot-demo.log
          exit 1
      - name: Install isolated Playwright runtime
        run: |
          mkdir -p /tmp/public-proof-playwright
          cd /tmp/public-proof-playwright
          npm init -y
          npm install --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Install GIF tooling
        run: sudo apt-get update && sudo apt-get install -y imagemagick gifsicle
      - name: Capture exact branch proof states
        env:
          NODE_PATH: /tmp/public-proof-playwright/node_modules
          CAPTURE_BASE_URL: http://127.0.0.1:4203/
          CAPTURE_OUTPUT_DIR: ${{ runner.temp }}/public-proof-captures
        run: node scripts/capture-public-proof.cjs
      - name: Build optimized platform walkthrough GIF
        shell: bash
        run: |
          set -euo pipefail
          captures='${{ runner.temp }}/public-proof-captures'
          out='docs/assets/public-proof/platform-failure-lab.gif'
          mkdir -p "$(dirname "$out")"
          frames=()
          for name in platform-main-demo platform-failure-lab-default failure-retrieval-unavailable failure-approval-rejected failure-sse-disconnect failure-sse-recovered failure-tool-policy-disabled; do
            test -s "$captures/$name.png"
            frames+=("$captures/$name.png")
          done
          convert -delay 125 -loop 0 "${frames[@]}" -resize '960x600>' -layers Optimize "$out"
          gifsicle -O3 --colors 128 "$out" -o "$out"
          test -s "$out"
          test "$(stat -c%s "$out")" -lt 8000000
      - name: Upload proof captures
        uses: actions/upload-artifact@v4
        with:
          name: ngx-copilot-platform-public-proof
          path: |
            ${{ runner.temp }}/public-proof-captures
            docs/assets/public-proof/platform-failure-lab.gif
          if-no-files-found: error
          retention-days: 30
      - name: Commit generated final asset to generation branch
        if: ${{ github.event_name == 'push' && github.ref_name == 'agent/final-visual-proof' }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/public-proof/platform-failure-lab.gif
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add final platform public proof GIF [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}
