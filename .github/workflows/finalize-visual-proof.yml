name: Finalize Visual Proof

on:
  push:
    branches: ['agent/final-visual-proof']
    paths:
      - '.github/workflows/finalize-visual-proof.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-visual-proof
      - name: Embed final GIF in reviewer entry points
        shell: python
        run: |
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text()
          needle = "- Use [Public Proof](docs/public-proof.md) for a 30-second / 3-minute / 15-minute review path and the exact evidence matrix.\n\nThe platform is intentionally more than a chat UI:"
          insert = "- Use [Public Proof](docs/public-proof.md) for a 30-second / 3-minute / 15-minute review path and the exact evidence matrix.\n\n<p align=\"center\">\n  <img src=\"docs/assets/public-proof/platform-failure-lab.gif\" alt=\"ngx-copilot-platform main demo and deterministic Failure Lab walkthrough\" width=\"960\" />\n</p>\n\n<p align=\"center\"><em>Real branch-build capture: main demo → Failure Lab → retrieval failure → approval rejection → SSE disconnect/recovery → policy-disabled tool. The scenarios are deterministic public proof, not production incidents.</em></p>\n\nThe platform is intentionally more than a chat UI:"
          if 'platform-failure-lab.gif' not in text:
              if needle not in text: raise SystemExit('README insertion point not found')
              readme.write_text(text.replace(needle, insert, 1))

          proof = Path('docs/public-proof.md')
          text = proof.read_text()
          needle = "## 30-second review\n\nOpen:"
          insert = "## 30-second review\n\n![Main demo and deterministic Failure Lab walkthrough](assets/public-proof/platform-failure-lab.gif)\n\nThe animation is generated from the exact branch build at a 1440×900 recruiter viewport. It shows the reusable platform surface and deterministic failure-contract states without implying live provider, retrieval, or tool incidents.\n\nOpen:"
          if 'platform-failure-lab.gif' not in text:
              if needle not in text: raise SystemExit('Public-proof insertion point not found')
              proof.write_text(text.replace(needle, insert, 1))

          Path('.github/workflows/finalize-visual-proof.yml').unlink()
      - name: Commit final embeds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Embed final platform visual proof [skip ci]'
          git push origin HEAD:agent/final-visual-proof
